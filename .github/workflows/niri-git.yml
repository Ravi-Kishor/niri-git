name: Build niri-git (Zen3 + Thin LTO)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Check upstream commit and existing release
        id: check
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/niri-wm/niri/commits/main" \
            | sed -n 's/.*"sha": "\([0-9a-f]\{7\}\).*/\1/p' | head -n 1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Skip scheduled builds if a release for this commit already exists
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=10" \
              | grep -q "g${SHA}"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release for commit $SHA already exists. Skipping build."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update system and install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed \
            base-devel git sudo pkgconf \
            cairo glib2 libdisplay-info libinput libxkbcommon \
            mesa pango pixman seatd systemd-libs \
            wayland wayland-protocols \
            pipewire libpipewire \
            clang llvm lld rust

      - name: Create builder user
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          mkdir -p /home/builder/.cargo /home/builder/cargo-target

      - name: Cache Cargo registry and target directory
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            /home/builder/cargo-target
          key: cargo-zen3-thinlto-${{ runner.os }}-${{ steps.check.outputs.sha }}
          restore-keys: |
            cargo-zen3-thinlto-${{ runner.os }}-

      - name: Fix cache ownership and create PKGBUILD
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cat > /home/builder/PKGBUILD << 'EOF'
          pkgname=niri-git
          pkgver=0
          pkgrel=1
          pkgdesc="Scrollable-tiling Wayland compositor (Zen3 + Thin LTO)"
          arch=(x86_64)
          url="https://github.com/niri-wm/niri"
          license=(GPL-3.0-or-later)

          depends=(
            cairo glib2 libdisplay-info libinput libpipewire libxkbcommon
            mesa pango pixman seatd systemd-libs pipewire
          )

          makedepends=(clang llvm lld rust git pkgconf)

          provides=(niri wayland-compositor)
          conflicts=(niri niri-bin)

          options=(!lto !debug strip)

          source=("niri::git+$url.git")
          b2sums=('SKIP')

          pkgver() {
            cd niri
            git describe --long --tags --abbrev=7 2>/dev/null | \
              sed 's/\([^-]*-g\)/r\1/;s/-/./g;s/^v//' || \
              printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
            cd niri
            cargo fetch --locked
          }

          build() {
            cd niri

            export CC=clang
            export CXX=clang++

            export CFLAGS="-O3 -pipe -march=znver3 -mtune=znver3"
            export CXXFLAGS="$CFLAGS"
            export LDFLAGS="-Wl,-O2,--as-needed"

            export RUSTFLAGS="-C target-cpu=znver3 -C linker=clang -C link-arg=-fuse-ld=lld -C link-arg=-Wl,-O2 -C link-arg=-Wl,--as-needed"

            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=4
            export CARGO_PROFILE_RELEASE_PANIC=abort
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=3
            export CARGO_PROFILE_RELEASE_STRIP=symbols

            export LIBCLANG_PATH="/usr/lib"
            export BINDGEN_EXTRA_CLANG_ARGS="$(pkg-config --cflags libpipewire-0.3 libspa-0.2)"
            export CARGO_TARGET_DIR="/home/builder/cargo-target"

            cargo build --release --frozen
          }

          package() {
            cd niri
            local target_dir="/home/builder/cargo-target/release"
            install -Dm755 "$target_dir/niri" -t "$pkgdir/usr/bin/"
            install -Dm755 resources/niri-session -t "$pkgdir/usr/bin/"
            install -Dm644 resources/niri{.service,-shutdown.target} -t "$pkgdir/usr/lib/systemd/user/"
            install -Dm644 resources/niri.desktop -t "$pkgdir/usr/share/wayland-sessions/"
            install -Dm644 resources/niri-portals.conf -t "$pkgdir/usr/share/xdg-desktop-portal/"
            install -Dm644 resources/default-config.kdl -t "$pkgdir/usr/share/doc/niri/"
          }
          EOF
          chown -R builder:builder /home/builder

      - name: Build package
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          su - builder -c '
            export MAKEFLAGS="-j$(nproc)"
            export CARGO_BUILD_JOBS="$(nproc)"
            export COMPRESSZST="zstd -c -T0 --ultra -20 -"
            cd ~
            makepkg --noconfirm --needed
          '

      - name: Prepare release
        if: steps.check.outputs.skip != 'true'
        id: pkg
        run: |
          set -euo pipefail
          PKG_PATH=$(find /home/builder -maxdepth 1 -type f -name "niri-git-*-x86_64.pkg.tar.zst" | head -n 1)
          test -n "$PKG_PATH"
          PKG_FILE=$(basename "$PKG_PATH")
          VERSION=$(echo "$PKG_FILE" | sed -E 's/^niri-git-(.*)-x86_64\.pkg\.tar\.zst/\1/')

          mkdir -p release
          cp "$PKG_PATH" "release/$PKG_FILE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}-zen3" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        if: steps.check.outputs.skip != 'true'
        id: check_release
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.pkg.outputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: niri-zen3-${{ steps.pkg.outputs.version }}
          path: release/*.pkg.tar.zst

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true' && steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: niri-git ${{ steps.pkg.outputs.version }} (Zen3 + Thin LTO)
          files: release/*.pkg.tar.zst
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
